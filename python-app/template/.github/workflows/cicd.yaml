name: ${{ values.app_name }}-cicd

on:
  push:
    branches:
      - main
    #paths:
    #  - src/**

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      -
        name: Shorten Commit id
        shell: bash
        run: |
          echo "COMMIT_ID=${{ '${GITHUB_SHA::6}' }}" >> $GITHUB_ENV
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ '${{ vars.DOCKERHUB_USERNAME }}' }}
          password: ${{ '${{ secrets.DOCKERHUB_TOKEN }}' }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: davismatrix/${{ values.app_name }}:${{ '${{ env.COMMIT_ID }}' }}
    outputs:
      commit_id: ${{ '${{ env.COMMIT_ID }}' }}

  cd:
    runs-on: [self-hosted]
    needs: ci
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v3
      -
        name: values.yaml update
        shell: bash
        run: |
          sed -i -E 's/^(  tag:).*/\1 ${{ '${{ needs.ci.outputs.commit_id }}' }}/' charts/${{ values.app_name }}/values-${{ values.app_env }}.yaml
      -
        name: Commit values change
        uses: Endbug/add-and-commit@v9
        with:
          message: "Update values.yaml with new image tag: ${{ '${{ needs.ci.outputs.commit_id }}' }}"
      -
        name: install argocd cli
        shell: bash
        run: |
          curl -ksSL -o argocd-linux-amd64 https://argocd-server.argocd/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64
      -
        name: ArgoCD Deployment
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --username admin \
            --password ${{ '${{ secrets.ARGOCD_PASSWORD }}' }} \
            --insecure \
            --grpc-web
          argocd app sync ${{ values.app_name }}