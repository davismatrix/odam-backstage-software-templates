apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dmatrix-python-app
spec:
  rules:
  - host: dmatrix-python-app.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dmatrix-python-app
            port:
              number: 8080
